name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "webbackend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  # Set in GitHub → Settings → Secrets and variables → Actions
  AZURE_WEBAPP_NAME: partsdb-prod-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore webbackend/PartsDb.Api.csproj

      - name: Build
        run: dotnet build webbackend/PartsDb.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish webbackend/PartsDb.Api.csproj --configuration Release --no-build --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: ./publish
