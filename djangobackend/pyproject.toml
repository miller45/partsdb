[project]
name = "partsdb-django"
version = "0.1.0"
description = "Django + Ninja port of the PartsDB .NET backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "django-ninja>=1.3",
    "django-cors-headers>=4.4",
    "mozilla-django-oidc>=4.0",
    "pyjwt[crypto]>=2.9",
    "requests>=2.32",
    "mssql-django>=1.5",
    "pyodbc>=5.1",
    "gunicorn>=23.0",
    "python-dotenv>=1.0",
    "whitenoise>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "partsdb.settings.dev"
python_files = ["test_*.py"]

[tool.setuptools]
packages = ["partsdb", "parts"]
